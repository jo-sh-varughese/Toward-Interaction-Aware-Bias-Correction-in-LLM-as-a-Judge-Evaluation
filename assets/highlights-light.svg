<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Highlights of the paper.</title><defs><style>@font-face{font-family:'Xr';src:url(data:font/woff2;base64,) format('woff2');}
.r{font-family:'Xr','STIX Two Text',Georgia,serif;font-feature-settings:'kern','liga','lnum','pnum';}
@font-face{font-family:'Xi';src:url(data:font/woff2;base64,) format('woff2');}
.i{font-family:'Xi','STIX Two Text',Georgia,serif;font-feature-settings:'kern','liga','lnum','pnum';}</style></defs>
<line x1="6" y1="8" x2="994" y2="8" stroke="#23224A" stroke-width="1.6"/>
<text x="6.0" y="34.0" class="r" font-size="13" fill="#7A3D12" text-anchor="start" letter-spacing="1.1" xml:space="preserve"><tspan>HIGHLIGHTS</tspan></text>
<text x="994.0" y="34.0" class="i" font-size="14.5" fill="#66648C" text-anchor="end"  xml:space="preserve"><tspan>What the evidence in the paper shows</tspan></text>
<text x="6.0" y="92.0" class="r" font-size="44" fill="#7A3D12" text-anchor="start" letter-spacing="-0.5" xml:space="preserve"><tspan>½ · i</tspan><tspan dy="12.3" font-size="29.9">PV</tspan><tspan dy="-12.3"> </tspan><tspan></tspan></text>
<text x="6.0" y="124.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>the exact error any single-offset position</tspan></text>
<text x="6.0" y="146.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>correction leaves on the</tspan></text>
<text x="6.0" y="168.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>verbose-versus-terse contrast, for every</tspan></text>
<text x="6.0" y="190.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>judge and every link.</tspan></text>
<text x="6.0" y="216.0" class="i" font-size="13.5" fill="#66648C" text-anchor="start"  xml:space="preserve"><tspan>Prop. 1</tspan></text>
<text x="347.3" y="92.0" class="r" font-size="44" fill="#7A3D12" text-anchor="start" letter-spacing="-0.5" xml:space="preserve"><tspan>+4.7 pts</tspan></text>
<text x="347.3" y="124.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>pooled position×length interaction across</tspan></text>
<text x="347.3" y="146.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>seven judges, 95% CI [1.6, 7.8], using no</tspan></text>
<text x="347.3" y="168.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>human labels.</tspan></text>
<text x="347.3" y="194.0" class="i" font-size="13.5" fill="#66648C" text-anchor="start"  xml:space="preserve"><tspan>Table 3</tspan></text>
<line x1="329.3333333333333" y1="52" x2="329.3333333333333" y2="204" stroke="#CBC9DD" stroke-width="1"/>
<text x="688.7" y="92.0" class="r" font-size="44" fill="#7A3D12" text-anchor="start" letter-spacing="-0.5" xml:space="preserve"><tspan>−0.1 → +4.6</tspan></text>
<text x="688.7" y="124.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>position bias in win-rate points when</tspan></text>
<text x="688.7" y="146.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>lengths match, then when the target is</tspan></text>
<text x="688.7" y="168.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>lengthened.</tspan></text>
<text x="688.7" y="194.0" class="i" font-size="13.5" fill="#66648C" text-anchor="start"  xml:space="preserve"><tspan>§6</tspan></text>
<line x1="670.6666666666666" y1="52" x2="670.6666666666666" y2="204" stroke="#CBC9DD" stroke-width="1"/>
<text x="6.0" y="292.0" class="r" font-size="44" fill="#7A3D12" text-anchor="start" letter-spacing="-0.5" xml:space="preserve"><tspan>10 pts</tspan></text>
<text x="6.0" y="324.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>inflation of one judge's interaction from</tspan></text>
<text x="6.0" y="346.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>counting a tie as a vote for slot B. The</tspan></text>
<text x="6.0" y="368.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>identity is exact.</tspan></text>
<text x="6.0" y="394.0" class="i" font-size="13.5" fill="#66648C" text-anchor="start"  xml:space="preserve"><tspan>Prop. 3</tspan></text>
<text x="347.3" y="292.0" class="r" font-size="44" fill="#7A3D12" text-anchor="start" letter-spacing="-0.5" xml:space="preserve"><tspan>12</tspan></text>
<text x="347.3" y="324.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>distinct stimuli behind the pilot's 20 pairs.</tspan></text>
<text x="347.3" y="346.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>All inference clusters on them, which</tspan></text>
<text x="347.3" y="368.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>removes every per-judge detection.</tspan></text>
<text x="347.3" y="394.0" class="i" font-size="13.5" fill="#66648C" text-anchor="start"  xml:space="preserve"><tspan>App. A</tspan></text>
<line x1="329.3333333333333" y1="252" x2="329.3333333333333" y2="404" stroke="#CBC9DD" stroke-width="1"/>
<text x="688.7" y="292.0" class="r" font-size="44" fill="#7A3D12" text-anchor="start" letter-spacing="-0.5" xml:space="preserve"><tspan>0 labels</tspan></text>
<text x="688.7" y="324.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>needed by SSIT. The quality gap of each</tspan></text>
<text x="688.7" y="346.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>stimulus cancels inside its own four swap</tspan></text>
<text x="688.7" y="368.0" class="r" font-size="16" fill="#23224A" text-anchor="start"  xml:space="preserve"><tspan>cells.</tspan></text>
<text x="688.7" y="394.0" class="i" font-size="13.5" fill="#66648C" text-anchor="start"  xml:space="preserve"><tspan>Prop. 2</tspan></text>
<line x1="670.6666666666666" y1="252" x2="670.6666666666666" y2="404" stroke="#CBC9DD" stroke-width="1"/>
</svg>